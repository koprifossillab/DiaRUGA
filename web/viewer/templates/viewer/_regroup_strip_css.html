{% comment %}
  시야 가르기·합치기의 프레임 줄 (2026-09-29). 검토 화면의 펼침판과 확인 화면
  둘이 같은 모양을 쓴다 — 누른 자리와 확인하는 자리가 다르게 생기면 대조가 안 된다.

  **자르는 칸은 사진 사이에 있다.** 예전에는 사진마다 "여기서 가른다" 가 붙어 있어
  그 사진 앞인지 뒤인지 알 수 없었고, 실제로 반대로 골라 한 장이 떨어져 나갔다.
{% endcomment %}
<style>
