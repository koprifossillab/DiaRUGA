#
# **기계가 틀린 자리만 적는다.** 쪽(PDF 쪽 번호)마다 `fix` 와 그 근거 `note`.
#   [x, y, "번호"]            그 점의 덩어리를 그 번호로. "-" 면 버린다
#                             (주인을 모를 때 — 틀리게 붙이는 것보다 낫다)
#   [x0, y0, x1, y1, "번호"]  사각형 안의 잉크를 떼어 그 번호로
#                             (닿아서 안 갈린 그림 · 텍스트 레이어가 번호를 놓친 그림)
# 좌표는 PDF 포인트, 왼쪽 위가 원점(`pdftotext -bbox` 와 같다). 대조 시트(높이 1400)
# 에서 짚었으면 × 716.16 / 1400.
#
# 판정의 근거는 대부분 **본문(해설)의 형태 서술**이다 — 번호가 안 찍힌 부분 그림
# (a·b·c)이 누구 것인지는 쪽만 봐서는 안 갈린다. 본문으로도 안 갈린 것은 "-" 다.

