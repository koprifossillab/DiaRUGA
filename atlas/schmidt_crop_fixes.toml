# Schmidt 도판 그림 크롭의 사람 정정 (`tools/crop_atlas_figures.py --book schmidt`)
#
# 쪽 열쇠는 "권/PDF 쪽"(1부터)이다 — Tafel 번호는 OCR 이라 열쇠가 못 된다(126).
# 좌표는 쪽 이미지(`/data3/DiaRUGA/atlas/schmidt/<권>/pNNNN.png`) 픽셀이다.
#
# - `figures` — **색인 그림 표기의 OCR 오류.** `index` 는 색인 원문 그대로이고
#   (`atlas/schmidt.json` 의 figures 와 글자까지 같아야 덮인다), `real` 은 도판을 보고
#   고친 값이다. 대부분 3↔8 혼동이다. 쪽의 번호 범위 밖이거나 거꾸로 가는 범위,
#   같은 종이면 그림이 닮았다는 것으로 판정했다. `parse_atlas.py` 가 figures 를 덮고
#   원래 값을 자리의 note 에 남긴다(한국 도감 `[plate_fix]` 와 같은 방식)
# - `junk` — 그림이 아닌 것(스캔에 붙은 손글씨 쪽지 등). 잉크에서 지운다
# - `skip` — 눈검사에서 끝내 틀린 자리 크롭의 그림 조각(`1-8` · `21_24`). 그 자리에는
#   크롭을 안 붙인다 — 틀리게 붙이는 것보다 낫다. 이유는 `skip_note`
# - `fix` — 한국 도감 정정표와 같은 점 짚기·오려내기(아직 없다)
#
# 그림 번호 자체(쪽마다 어느 번호가 어디 있나)는 사람이 327쪽을 다 보고 확정한
# labels 에서 온다 — 241 devlog. 확신이 없어 넣지 않은 후보도 거기 적었다.

