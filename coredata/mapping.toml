    [5, "caco3", "CaCO3", "%"],
    [6, "toc", "TOC", "wt%"],
    [7, "cn_ratio", "C/N", ""],
  ]

  # 13열 오른쪽은 계량 원자료(`Sample`·`Weight(g)`·`Density`·`AVERAGE`·
  # `재분석 전`)라 안 읽는다 — 깊이 축에 얹을 값이 아니다.
  [[core.block]]
  sheet = "Size"
  header_row = 2
  depth_col = 1
  depth_unit = "cm"
  sort_order = 30
  columns = [
    [2, "gravel", "Gravel", "%"],
    [3, "sand", "Sand", "%"],
    [4, "silt", "Silt", "%"],
    [5, "clay", "Clay", "%"],
    [6, "grain_mean", "입도 Mean", "φ"],
