# `RS21-diatom.pptx` (206). 원본 xlsx 가 없고 **엑셀에서 붙여 넣은 산점도**만
# 있다 — 값은 차트 캐시에 그대로 들어 있어 거기서 읽는다. 코어 다섯이 슬라이드
# 두 장씩(물성 셋 · Opal 하나)이고 차트는 슬라이드 번호와 제목으로 짚는다.
#
# **Opal 만 축이 뒤집혀 있다** — 함수율·TOC·밀도는 깊이가 y 축인데 Opal 은
# x 축이다. 그래서 `depth_axis` 를 차트마다 적는다. 추출기가 깊이가 내려가는
# 차례인지 보고, 반대로 적혔으면 멈춘다.
#
# 제목의 "opal final" 이 어느 계산 단계인지는 원본 xlsx 가 없어 모른다 —
# 값(2.6~36)이 RS14 의 Opal(%)과 같은 자리라 % 로 둔다. 함수율 1 cm · TOC 2 cm ·
# 밀도 4 cm · Opal 2 cm 간격. 밀도 차트의 제목이 앞 둘만 `Density(g/cm3)` 다. 코어 길이는 KPDC(`Locality.kpdc_meta`) 값이다.

