# 모른다 — 모르는 것을 이름 붙여 넣지 않는다. 확인되면 한 줄 더 적는다.
  [[core.block]]
  sheet = "W.C"
  header_row = 2
  depth_col = 1
  depth_unit = "cm"
  sort_order = 10
  columns = [[5, "wc", "함수율", "%"]]

  [[core.block]]
  sheet = "CN"
  header_row = 2
  depth_col = 1
  depth_unit = "cm"
  sort_order = 20
  columns = [
    [2, "tn", "TN", "wt%"],
    [3, "tc", "TC", "wt%"],
